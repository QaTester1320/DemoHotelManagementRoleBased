                      <td class="num">${it.reorderLevel} ${it.unit}</td>
                      <td>
                        <div style="display:flex;gap:0.35rem;">
                          <button class="btn btn-secondary btn-xs" data-issue-inv="${it.id}">Issue -5</button>
                          <button class="btn btn-primary btn-xs" data-recv-inv="${it.id}">Receive +20</button>
                        </div>
                      </td>
                    </tr>
                  `;
                }).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;

      container.querySelectorAll('[data-issue-inv]').forEach(btn => {
        btn.onclick = () => {
          const item = db.inventoryItems.find(x => x.id === btn.getAttribute('data-issue-inv'));
          if (!item) return;
          if (!session.bugMode && item.stock < 5) {
            showToast(`Insufficient stock for ${item.name}.`, 'error');
            return;
          }
          // Intentional QA Bug #6 when Bug Mode is ON: Adds +5 instead of subtracting -5!
          item.stock = session.bugMode ? item.stock + 5 : item.stock - 5;
          logAudit('Stores & Inventory', `Issued 5 ${item.unit} of ${item.name}`);
          saveState();
          renderStockLedgerModule(container);
          showToast(`Issued 5 ${item.unit} of ${item.name}.`, 'info');
        };
      });

      container.querySelectorAll('[data-recv-inv]').forEach(btn => {
        btn.onclick = () => {
          const item = db.inventoryItems.find(x => x.id === btn.getAttribute('data-recv-inv'));
          if (!item) return;
          item.stock += 20;
          logAudit('Stores & Inventory', `Received 20 ${item.unit} of ${item.name}`);
          saveState();
          renderStockLedgerModule(container);
          showToast(`Received +20 ${item.unit} into ${item.name}.`, 'success');
        };
      });
    }

            <div class="kpi-value num">${db.systemSettings.businessDate}</div>
            <div class="kpi-foot">Last Run: ${db.systemSettings.lastNightAuditAt}</div>
          </div>
          <div class="kpi-card">
            <div class="kpi-top"><span>In-House Folios to Post</span><span class="badge badge-warning">Auto-Tariff</span></div>
            <div class="kpi-value num">${inHouseCount} Rooms</div>
            <div class="kpi-foot">Posts nightly room rate + 12% GST</div>
          </div>
          <div class="kpi-card">
            <div class="kpi-top"><span>Completed Audit Cycles</span><span class="badge badge-success">Verified</span></div>
            <div class="kpi-value num">${db.systemSettings.nightAuditCount}</div>
            <div class="kpi-foot">Zero unposted suspense items</div>
          </div>
        </div>

        <div class="card" style="max-width:680px;">
          <div class="card-header"><div class="card-title">${ICONS.moon} Execute Night Audit Sequence</div></div>
          <div class="card-body">
            <p style="font-size:0.88rem;color:var(--text-secondary);margin-bottom:1rem;line-height:1.6;">
              Running Night Audit will post an automated nightly room charge to all <strong>${inHouseCount}</strong> currently checked-in folios, mark occupied rooms as needing morning housekeeping refresh, and advance the PMS Business Date by +1 day.
            </p>
            <button class="btn btn-primary" id="run-night-audit-btn">Run Night Audit & Advance Business Date</button>
          </div>
        </div>
      `;

      document.getElementById('run-night-audit-btn').onclick = () => {
        confirmCustomDialog({
          title: `Run Night Audit for ${db.systemSettings.businessDate}?`,
          message: `This will post nightly room tariffs to ${inHouseCount} in-house folios and roll the system business date forward by 1 day.`,
          confirmLabel: 'Execute Night Audit',
          danger: false,
          onConfirm: () => {
            const activeRes = db.reservations.filter(r => r.status === 'Checked-In');
            activeRes.forEach(res => {
              const folio = db.folios.find(f => f.id === res.folioId);
              if (folio) {
                folio.items.push({
                  id: `FI-NA-${Date.now()}-${res.id}`,
                  date: db.systemSettings.businessDate,
                  category: 'Night Audit Tariff',
                  description: `Nightly Room Charge (${db.systemSettings.businessDate})`,
                  amount: res.ratePerNight,
                  tax: Math.round(res.ratePerNight * 0.12)
                });
                recalculateFolio(folio);
              }
              const rm = getRoom(res.roomId);
              if (rm) rm.hkStatus = 'Dirty';
            });

            const nextDate = new Date(db.systemSettings.businessDate + 'T10:00:00');
            nextDate.setDate(nextDate.getDate() + 1);
            db.systemSettings.businessDate = nextDate.toISOString().split('T')[0];
            db.systemSettings.nightAuditCount += 1;
            db.systemSettings.lastNightAuditAt = `${db.systemSettings.businessDate} 02:00 AM`;

            logAudit('Night Audit', `Night Audit completed. Posted tariffs to ${activeRes.length} folios. New Business Date: ${db.systemSettings.businessDate}`);
            saveState();
            renderApp();
            showToast(`Night Audit completed! Business Date is now ${db.systemSettings.businessDate}.`, 'success');
          }
        });
      };
    }

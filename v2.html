            <div class="kpi-value num">${db.systemSettings.businessDate}</div>
            <div class="kpi-foot">Last Run: ${db.systemSettings.lastNightAuditAt}</div>
          </div>
          <div class="kpi-card">
            <div class="kpi-top"><span>In-House Folios to Post</span><span class="badge badge-warning">Auto-Tariff</span></div>
            <div class="kpi-value num">${inHouseCount} Rooms</div>
            <div class="kpi-foot">Posts nightly room rate + 12% GST</div>
          </div>
          <div class="kpi-card">
            <div class="kpi-top"><span>Completed Audit Cycles</span><span class="badge badge-success">Verified</span></div>
            <div class="kpi-value num">${db.systemSettings.nightAuditCount}</div>
            <div class="kpi-foot">Zero unposted suspense items</div>
          </div>
        </div>

        <div class="card" style="max-width:680px;">
          <div class="card-header"><div class="card-title">${ICONS.moon} Execute Night Audit Sequence</div></div>
          <div class="card-body">
            <p style="font-size:0.88rem;color:var(--text-secondary);margin-bottom:1rem;line-height:1.6;">
              Running Night Audit will post an automated nightly room charge to all <strong>${inHouseCount}</strong> currently checked-in folios, mark occupied rooms as needing morning housekeeping refresh, and advance the PMS Business Date by +1 day.
            </p>
            <button class="btn btn-primary" id="run-night-audit-btn">Run Night Audit & Advance Business Date</button>
          </div>
        </div>
      `;

      document.getElementById('run-night-audit-btn').onclick = () => {
        confirmCustomDialog({
          title: `Run Night Audit for ${db.systemSettings.businessDate}?`,
          message: `This will post nightly room tariffs to ${inHouseCount} in-house folios and roll the system business date forward by 1 day.`,
          confirmLabel: 'Execute Night Audit',
          danger: false,
          onConfirm: () => {
            const activeRes = db.reservations.filter(r => r.status === 'Checked-In');
            activeRes.forEach(res => {
              const folio = db.folios.find(f => f.id === res.folioId);
              if (folio) {
                folio.items.push({
                  id: `FI-NA-${Date.now()}-${res.id}`,
                  date: db.systemSettings.businessDate,
                  category: 'Night Audit Tariff',
                  description: `Nightly Room Charge (${db.systemSettings.businessDate})`,
                  amount: res.ratePerNight,
                  tax: Math.round(res.ratePerNight * 0.12)
                });
                recalculateFolio(folio);
              }
              const rm = getRoom(res.roomId);
              if (rm) rm.hkStatus = 'Dirty';
            });

            const nextDate = new Date(db.systemSettings.businessDate + 'T10:00:00');
            nextDate.setDate(nextDate.getDate() + 1);
            db.systemSettings.businessDate = nextDate.toISOString().split('T')[0];
            db.systemSettings.nightAuditCount += 1;
            db.systemSettings.lastNightAuditAt = `${db.systemSettings.businessDate} 02:00 AM`;

            logAudit('Night Audit', `Night Audit completed. Posted tariffs to ${activeRes.length} folios. New Business Date: ${db.systemSettings.businessDate}`);
            saveState();
            renderApp();
            showToast(`Night Audit completed! Business Date is now ${db.systemSettings.businessDate}.`, 'success');
          }
        });
      };
    }

    function renderDashboardModule(container) {
      const rooms = filterByProperty(db.rooms);
      const reservations = filterByProperty(db.reservations);
      const folios = filterByProperty(db.folios);
      const payments = filterByProperty(db.payments);
      const reviews = filterByProperty(db.reviews);

      const totalRooms = rooms.length || 1;
      const occupied = rooms.filter(r => r.status === 'Occupied').length;
      const reserved = rooms.filter(r => r.status === 'Reserved').length;
      const available = rooms.filter(r => r.status === 'Available').length;
      const instantAvailable = rooms.filter(r => r.status === 'Available' && r.hkStatus === 'Clean').length;
      const dirty = rooms.filter(r => r.hkStatus === 'Dirty').length;
      const maintenance = rooms.filter(r => r.status === 'Maintenance').length;

      const inHouse = reservations.filter(r => r.status === 'Checked-In');
      const upcoming = reservations.filter(r => r.status === 'Confirmed' || r.status === 'Tentative');
      const checkedOut = reservations.filter(r => r.status === 'Checked-Out');
      const cancelled = reservations.filter(r => r.status === 'Cancelled');

      const totalBilled = folios.reduce((sum, f) => {
        return sum + (f.items || []).reduce((s, it) => s + Number(it.amount || 0) + Number(it.tax || 0), 0);
      }, 0);
      const collected = payments.reduce((sum, p) => sum + Number(p.amount || 0), 0);
      const openReceivable = folios.reduce((sum, f) => sum + Math.max(0, Number(f.balance || 0)), 0);
      const roomRevenue = inHouse.reduce((sum, r) => sum + Number(r.ratePerNight || 0) * Number(r.nights || 1), 0);
      const adr = inHouse.length ? Math.round(roomRevenue / inHouse.length) : 0;
      const occupancy = Math.round((occupied / totalRooms) * 100);
      const revpar = Math.round(roomRevenue / totalRooms);

      const sourceCounts = {};
      reservations.forEach(r => { sourceCounts[r.source] = (sourceCounts[r.source] || 0) + 1; });
      const topSources = Object.entries(sourceCounts).sort((a,b) => b[1]-a[1]).slice(0,6);
      const avgRating = reviews.length ? (reviews.reduce((s,r)=>s+Number(r.rating||0),0)/reviews.length).toFixed(1) : 'N/A';

      container.innerHTML = `
        <div class="page-header">

          </div>
          <div class="kpi-card">
            <div class="kpi-top"><span>Instant Available</span><span class="badge badge-success">Ready</span></div>
            <div class="kpi-value num" style="color:#15803d;">${instantAvailable}</div>
            <div class="kpi-foot">Vacant and housekeeping-clean rooms</div>
          </div>
          <div class="kpi-card">
            <div class="kpi-top"><span>ADR</span><span class="badge badge-info">Average Daily Rate</span></div>
            <div class="kpi-value num">${formatCurrency(adr)}</div>
            <div class="kpi-foot">Based on current in-house reservations</div>

          <div class="kpi-card">
            <div class="kpi-top"><span>RevPAR</span><span class="badge badge-warning">Revenue per Room</span></div>

          </div>
          <div class="kpi-card">
            <div class="kpi-top"><span>Open Receivables</span><span class="badge badge-danger">Due</span></div>

            <div class="kpi-foot">Unsettled guest folio balances</div>
          </div>
        </div>

        <div class="card">
          <div class="card-header"><div class="card-title">${ICONS.dashboard} Room & Reservation Status</div></div>
          <div class="table-wrap">
            <table>
              <thead><tr><th>Operational Metric</th><th>Count</th><th>Share</th><th>Operational Meaning</th></tr></thead>
              <tbody>
                <tr><td>Occupied Rooms</td><td class="num">${occupied}</td><td class="num">${Math.round((occupied/totalRooms)*100)}%</td><td>Guests currently in-house</td></tr>
                <tr><td>Reserved Rooms</td><td class="num">${reserved}</td><td class="num">${Math.round((reserved/totalRooms)*100)}%</td><td>Blocked for upcoming arrivals</td></tr>

                <tr><td>Dirty Rooms</td><td class="num">${dirty}</td><td class="num">${Math.round((dirty/totalRooms)*100)}%</td><td>Requires housekeeping attention</td></tr>
                <tr><td>Maintenance Rooms</td><td class="num">${maintenance}</td><td class="num">${Math.round((maintenance/totalRooms)*100)}%</td><td>Out of order or under repair</td></tr>
                <tr><td>In-House Reservations</td><td class="num">${inHouse.length}</td><td class="num">—</td><td>Currently checked-in guests</td></tr>

            <div class="kpi-card">

              <div class="kpi-foot">Room, F&B, laundry, and other posted charges</div>

          <div class="table-wrap">

        </div>
      `;

      const searchInput = document.getElementById('guest-search-input');
      if (searchInput) {
        searchInput.oninput = (e) => {
          session.filters.guestSearch = e.target.value;
          saveState();
          renderActiveSubModule();
        };
      }

      const addBtn = document.getElementById('btn-add-guest');
      if (addBtn) addBtn.onclick = () => openGuestFormModal();

      container.querySelectorAll('[data-view-guest]').forEach(btn => {
        btn.onclick = () => {
          const g = db.guests.find(x => x.id === btn.getAttribute('data-view-guest'));
          if (!g) return;
          const guestRes = db.reservations.filter(r => r.guestId === g.id);
          openCustomModal({
            title: `Guest Profile — ${g.fullName}`,
            bodyHtml: `
              <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.8rem;font-size:0.86rem;">
                <div><strong>Guest ID:</strong> ${escapeHtml(g.id)}</div>
                <div><strong>VIP Tier:</strong> ${escapeHtml(g.vipTier)}</div>
                <div><strong>Email:</strong> ${escapeHtml(g.email)}</div>
                <div><strong>Phone:</strong> ${escapeHtml(g.phone)}</div>
                <div><strong>ID Type:</strong> ${escapeHtml(g.idType)}</div>
                <div><strong>ID Number:</strong> ${escapeHtml(g.idNumber)}</div>
                <div><strong>Nationality:</strong> ${escapeHtml(g.nationality)}</div>
                <div><strong>Loyalty Points:</strong> <span class="num">${g.loyaltyPoints}</span></div>
                <div><strong>Total Stays:</strong> <span class="num">${g.totalStays}</span></div>
                <div><strong>Status:</strong> ${g.blacklisted ? 'Blacklisted' : 'Active'}</div>
                <div style="grid-column:1/-1;"><strong>Preferences:</strong> ${escapeHtml(g.preferences || 'None')}</div>
                <div style="grid-column:1/-1;"><strong>Reservation History:</strong> ${guestRes.length} booking(s)</div>
              </div>
            `,
            footerHtml: `<button class="btn btn-dark" onclick="closeCustomModal()">Close</button>`
          });
        };
      });

      container.querySelectorAll('[data-edit-guest]').forEach(btn => {
        btn.onclick = () => {
          const g = db.guests.find(x => x.id === btn.getAttribute('data-edit-guest'));
          if (g) openGuestFormModal(g);
        };
      });

      container.querySelectorAll('[data-del-guest]').forEach(btn => {
        btn.onclick = () => {
          const gid = btn.getAttribute('data-del-guest');
          const g = db.guests.find(x => x.id === gid);
          if (!g) return;
          const activeStay = db.reservations.some(r => r.guestId === gid && r.status === 'Checked-In');
          if (activeStay) {
            showToast('Cannot delete a guest with an active Checked-In reservation.', 'error');
            return;
          }
          confirmCustomDialog({
            title: `Delete Guest — ${g.fullName}?`,
            message: 'This will permanently remove the guest profile and KYC record from the directory.',
            onConfirm: () => {
              db.guests = db.guests.filter(x => x.id !== gid);
              logAudit('Guests & KYC', `Deleted guest profile ${g.fullName}`);
              saveState();
              renderActiveSubModule();
              showToast(`${g.fullName} deleted.`, 'warning');
            }
          });
        };
      });
    }

    function openGuestFormModal(existing = null) {
      openCustomModal({
        title: existing ? `Edit Guest — ${existing.fullName}` : 'Register New Guest',
        bodyHtml: `
          <div class="grid-2">
            <div class="form-group">
              <label class="form-label">Full Name *</label>
              <input type="text" class="form-control" id="gst-name" value="${existing ? escapeHtml(existing.fullName) : ''}" placeholder="e.g. Aarav Sharma" />
            </div>
            <div class="form-group">
              <label class="form-label">Email *</label>
              <input type="email" class="form-control" id="gst-email" value="${existing ? escapeHtml(existing.email) : ''}" placeholder="e.g. guest@example.com" />
            </div>
          </div>
          <div class="grid-2">
            <div class="form-group">
              <label class="form-label">Phone *</label>
              <input type="text" class="form-control" id="gst-phone" value="${existing ? escapeHtml(existing.phone) : ''}" placeholder="e.g. +91 98765 43210" />
            </div>
            <div class="form-group">
              <label class="form-label">City</label>
              <input type="text" class="form-control" id="gst-city" value="${existing ? escapeHtml(existing.city) : ''}" placeholder="e.g. Mumbai" />
            </div>
          </div>
          <div class="grid-2">
            <div class="form-group">
              <label class="form-label">ID Type *</label>
              <select class="form-control" id="gst-idtype">
                ${['Aadhaar Card','Passport','Driving License','Voter ID'].map(t => `<option value="${t}" ${existing && existing.idType === t ? 'selected' : ''}>${t}</option>`).join('')}
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">ID Number *</label>
              <input type="text" class="form-control" id="gst-idnum" value="${existing ? escapeHtml(existing.idNumber) : ''}" placeholder="Enter ID number" />
            </div>
          </div>
          <div class="grid-2">
            <div class="form-group">
              <label class="form-label">VIP Tier</label>
              <select class="form-control" id="gst-tier">
                ${['Regular','Silver','Gold','Platinum'].map(t => `<option value="${t}" ${existing && existing.vipTier === t ? 'selected' : ''}>${t}</option>`).join('')}
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">Nationality</label>
              <input type="text" class="form-control" id="gst-nationality" value="${existing ? escapeHtml(existing.nationality) : 'Indian'}" />
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">Preferences</label>
            <input type="text" class="form-control" id="gst-prefs" value="${existing ? escapeHtml(existing.preferences || '') : ''}" placeholder="e.g. High floor, Early check-in" />
          </div>
        `,
        footerHtml: `
          <button class="btn btn-secondary" onclick="closeCustomModal()">Cancel</button>
          <button class="btn btn-primary" id="save-guest-btn">Save Guest</button>
        `,
        onMount: () => {
          document.getElementById('save-guest-btn').onclick = () => {
            const fullName = document.getElementById('gst-name').value.trim();
            const email = document.getElementById('gst-email').value.trim();
            const phone = document.getElementById('gst-phone').value.trim();
            const city = document.getElementById('gst-city').value.trim();
            const idType = document.getElementById('gst-idtype').value;
            const idNumber = document.getElementById('gst-idnum').value.trim();
            const vipTier = document.getElementById('gst-tier').value;
            const nationality = document.getElementById('gst-nationality').value.trim();
            const preferences = document.getElementById('gst-prefs').value.trim();

            if (!fullName || !email || !phone || !idNumber) {
              showToast('Full Name, Email, Phone, and ID Number are required.', 'error');
              return;
            }
            if (!email.includes('@') || !email.includes('.')) {
              showToast('Enter a valid email address.', 'error');
              return;
            }
            if (phone.replace(/\D/g,'').length < 10) {
              showToast('Enter a valid phone number with at least 10 digits.', 'error');
              return;
            }

            if (existing) {
              Object.assign(existing, { fullName, email, phone, city, idType, idNumber, vipTier, nationality, preferences });
              logAudit('Guests & KYC', `Updated guest profile ${fullName}`);
            } else {
              db.guests.push({
                id: `GST-${String(db.guests.length + 1).padStart(3,'0')}`,
                fullName, email, phone, city, idType, idNumber, vipTier, nationality,
                loyaltyPoints: 0, totalStays: 0, preferences, blacklisted: false
              });
              logAudit('Guests & KYC', `Registered new guest ${fullName}`);
            }
            saveState();
            closeCustomModal();
            renderActiveSubModule();
            showToast(existing ? 'Guest profile updated successfully.' : 'New guest registered successfully.', 'success');
          };
        }
      });
    }

    // --------------------------------------------------------------------------
    // 11. BOOTSTRAP ON WINDOW LOAD
    // --------------------------------------------------------------------------
    window.onload = function () {
      loadState();
      renderApp();
    };
  </script>
</body>
</html>

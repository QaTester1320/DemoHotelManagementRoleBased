    /* ==========================================================================
       AURELIASTAY ENTERPRISE HMS — EXECUTIVE DESIGN SYSTEM & CUSTOM CSS
       Typography: Aptos Display / Aptos Slab / Bahnschrift / Segoe UI
       ========================================================================== */
    :root {
      --font-display: 'Aptos Display', 'Bahnschrift', 'Segoe UI', system-ui, -apple-system, sans-serif;
      --font-slab: 'Aptos Slab', 'Rockwell', 'Segoe UI', serif;
      --font-sans: 'Aptos', 'Segoe UI', system-ui, -apple-system, sans-serif;
      --font-mono: 'Cascadia Code', 'Consolas', monospace;

      --sidebar-bg: #0f172a;
      --sidebar-surface: #1e293b;
      --sidebar-border: #334155;
      --sidebar-text: #cbd5e1;
      --sidebar-text-active: #ffffff;
      --accent-primary: #b45309;       /* Rich Warm Amber-Gold */
      --accent-primary-hover: #92400e;
      --accent-primary-soft: #fef3c7;
      --accent-indigo: #1d4ed8;
      --accent-indigo-soft: #dbeafe;

      --bg-canvas: #f8fafc;
      --bg-card: #ffffff;
      --bg-subtle: #fcecee;
      --border-light: #e2e8f0;
      --border-medium: #cbd5e1;

      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-muted: #64748b;

      --status-success-bg: #dcfce7;
      --status-success-text: #166534;
      --status-warning-bg: #fef3c7;
      --status-warning-text: #92400e;
      --status-danger-bg: #fee2e2;
      --status-danger-text: #991b1b;
      --status-info-bg: #dbeafe;
      --status-info-text: #1e40af;
      --status-purple-bg: #f3e8ff;
      --status-purple-text: #6b21a8;

      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
      --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.05);
      --shadow-md: 0 4px 12px rgba(15, 23, 42, 0.08);
      --shadow-lg: 0 16px 36px rgba(15, 23, 42, 0.18);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-sans);
      background-color: var(--bg-canvas);
      color: var(--text-primary);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    h1, h2, h3, h4, .display-font {
      font-family: var(--font-display);
      font-weight: 700;
      letter-spacing: -0.015em;
    }

    .slab-font {
      font-family: var(--font-slab);
      font-weight: 700;
    }

    .num {
      font-variant-numeric: tabular-nums;
      font-feature-settings: "tnum";
    }

    /* Buttons & Inputs */
    button, input, select, textarea {
      font-family: inherit;
      font-size: 0.9rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
      padding: 0.52rem 0.95rem;
      border-radius: var(--radius-sm);
      font-weight: 600;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.16s ease;
      white-space: nowrap;
      text-decoration: none;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-primary {
      background: var(--accent-primary);
      color: #fff;
    }
    .btn-primary:hover:not(:disabled) {
      background: var(--accent-primary-hover);
    }

    .btn-dark {
      background: #0f172a;
      color: #fff;
    }
    .btn-dark:hover:not(:disabled) {
      background: #1e293b;
    }

    .btn-secondary {
      background: #fff;
      color: var(--text-primary);
      border-color: var(--border-medium);
    }
    .btn-secondary:hover:not(:disabled) {
      background: var(--bg-subtle);
    }

    .btn-danger {
      background: #dc2626;
      color: #fff;
    }
    .btn-danger:hover:not(:disabled) {
      background: #b91c1c;
    }

    .btn-success {
      background: #15803d;
      color: #fff;
    }
    .btn-success:hover:not(:disabled) {
      background: #166534;
    }

    .btn-sm {
      padding: 0.34rem 0.68rem;
      font-size: 0.8rem;
    }

    .btn-xs {
      padding: 0.22rem 0.5rem;
      font-size: 0.74rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.32rem;
      margin-bottom: 0.85rem;
    }

    .form-label {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-secondary);
    }

    .form-control {
      width: 100%;
      padding: 0.52rem 0.75rem;
      border: 1px solid var(--border-medium);
      border-radius: var(--radius-sm);
      background: #fff;
      color: var(--text-primary);
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .form-control:focus {
      outline: none;
      border-color: var(--accent-primary);
      box-shadow: 0 0 0 3px rgba(180, 83, 9, 0.14);
    }

    /* Password Wrapper with Eye Toggle */
    .pwd-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      width: 100%;
    }
    .pwd-wrapper .form-control {
      padding-right: 2.5rem;
    }
    .pwd-eye-btn {
      position: absolute;
      right: 0.5rem;
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 0.25rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
    }
    .pwd-eye-btn:hover {
      color: var(--text-primary);
      background: var(--bg-subtle);
    }

    /* Badges */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      padding: 0.18rem 0.55rem;
      border-radius: 999px;
      font-size: 0.74rem;
      font-weight: 700;
      letter-spacing: 0.01em;
    }
    .badge-success { background: var(--status-success-bg); color: var(--status-success-text); }
    .badge-warning { background: var(--status-warning-bg); color: var(--status-warning-text); }
    .badge-danger  { background: var(--status-danger-bg);  color: var(--status-danger-text); }
    .badge-info    { background: var(--status-info-bg);    color: var(--status-info-text); }
    .badge-purple  { background: var(--status-purple-bg);  color: var(--status-purple-text); }
    .badge-neutral { background: #e2e8f0; color: #334155; }

    /* ==========================================================================
       LOGIN SCREEN
       ========================================================================== */
    .login-shell {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      background: #0f172a;
    }

    @media (max-width: 920px) {
      .login-shell {
        grid-template-columns: 1fr;
      }
      .login-hero {
        display: none !important;
      }
    }

    .login-hero {
      padding: 3.5rem;
      background: linear-gradient(145deg, #0f172a 0%, #1e293b 55%, #451a03 100%);
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border-right: 1px solid #334155;
    }

    .login-panel {
      background: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .login-card {
      width: 100%;
      max-width: 460px;
      background: #fff;
      border: 1px solid var(--border-light);
      border-radius: var(--radius-lg);
      padding: 2.2rem;
      box-shadow: var(--shadow-lg);
    }

    .role-chip-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem;
      margin-top: 0.5rem;
    }

    .role-chip {
      text-align: left;
      padding: 0.55rem 0.7rem;
      border: 1px solid var(--border-light);
      border-radius: var(--radius-sm);
      background: var(--bg-subtle);
      cursor: pointer;
      transition: all 0.15s;
    }
    .role-chip:hover {
      border-color: var(--accent-primary);
      background: var(--accent-primary-soft);
    }
    .role-chip strong {
      display: block;
      font-size: 0.78rem;
      color: var(--text-primary);
    }
    .role-chip span {
      font-size: 0.7rem;
      color: var(--text-muted);
    }

    /* ==========================================================================
       MAIN APP SHELL (SIDEBAR + TOPBAR + WORKSPACE)
       ========================================================================== */
    .app-shell {
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      width: 280px;
      height: 100vh;
      position: sticky;
      top: 0;
      background: var(--sidebar-bg);
      color: var(--sidebar-text);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      border-right: 1px solid var(--sidebar-border);
      transition: transform 0.25s ease;
      z-index: 40;
      overflow: hidden;
    }

    .sidebar-header {
      padding: 1.15rem 1.2rem;
      border-bottom: 1px solid var(--sidebar-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .sidebar-header {
      padding: 1.15rem 1.2rem;
      border-bottom: 1px solid var(--sidebar-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand-lockup {
      display: flex;
      align-items: center;
      gap: 0.65rem;
    }

    .brand-emblem {
      width: 36px;
      height: 36px;
      border-radius: 9px;
      background: linear-gradient(135deg, #d97706, #92400e);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(217, 119, 6, 0.35);
    }

    .sidebar-nav {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 0.75rem 0.65rem;
    }

    .nav-group {
      margin-bottom: 0.35rem;
    }

    .nav-main-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.6rem 0.75rem;
      border: none;
      border-radius: var(--radius-sm);
      background: transparent;
      color: var(--sidebar-text);
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      text-align: left;
      transition: background 0.15s, color 0.15s;
    }

    .nav-main-btn:hover {
      background: var(--sidebar-surface);
      color: #fff;
    }

    .nav-main-btn.active {
      background: rgba(180, 83, 9, 0.22);
      color: #fbbf24;
    }

    .nav-main-left {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .nav-sub-list {
      padding-left: 1.45rem;
      margin-top: 0.2rem;
      margin-bottom: 0.4rem;
      display: flex;
      flex-direction: column;
      gap: 0.18rem;
      border-left: 1px solid #334155;
      margin-left: 1.15rem;
    }

    .nav-sub-btn {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.44rem 0.65rem;
      border: none;
      border-radius: 5px;
      background: transparent;
      color: #94a3b8;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      text-align: left;
      transition: all 0.15s;
    }

    .nav-sub-btn:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.05);
    }

    .nav-sub-btn.active {
      background: var(--accent-primary);
      color: #fff;
      font-weight: 600;
    }

    .sidebar-footer {
      padding: 0.85rem 1rem;
      border-top: 1px solid var(--sidebar-border);
      background: rgba(15, 23, 42, 0.98);
      font-size: 0.78rem;
      flex-shrink: 0;
    }

    /* Main Workspace Area */
    .main-column {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .topbar {
      background: #ffffff;
      border-bottom: 1px solid var(--border-light);
      padding: 0.7rem 1.4rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
      position: sticky;
      top: 0;
      z-index: 30;
    }

    .topbar-left, .topbar-right {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .property-switcher {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      background: var(--bg-subtle);
      border: 1px solid var(--border-medium);
      padding: 0.32rem 0.65rem;
      border-radius: var(--radius-sm);
    }

    .property-switcher select {
      border: none;
      background: transparent;
      font-weight: 700;
      color: var(--text-primary);
      cursor: pointer;
      outline: none;
    }

    /* QA Bug Mode Switch */
    .bug-mode-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.32rem 0.7rem;
      border-radius: 999px;
      border: 1px solid var(--border-medium);
      background: #fff;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      user-select: none;
    }
    .bug-mode-pill.active {
      background: #fef2f2;
      border-color: #f87171;
      color: #b91c1c;
    }
    .switch-track {
      width: 32px;
      height: 18px;
      background: #cbd5e1;
      border-radius: 999px;
      position: relative;
      transition: background 0.2s;
    }
    .bug-mode-pill.active .switch-track {
      background: #dc2626;
    }
    .switch-thumb {
      width: 14px;
      height: 14px;
      background: #fff;
      border-radius: 50%;
      position: absolute;
      top: 2px;
      left: 2px;
      transition: transform 0.2s;
    }
    .bug-mode-pill.active .switch-thumb {
      transform: translateX(14px);
    }

    .workspace-content {
      padding: 1.4rem;
      max-width: 1540px;
      width: 100%;
      margin: 0 auto;
    }

    /* Cards, Grids, Tables */
    .page-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
      margin-bottom: 1.25rem;
    }

    .page-title {
      font-size: 1.45rem;
      color: var(--text-primary);
    }

    .page-subtitle {
      font-size: 0.86rem;
      color: var(--text-secondary);
      margin-top: 0.15rem;
    }

    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(215px, 1fr));
      gap: 1rem;
      margin-bottom: 1.35rem;
    }

    .kpi-card {
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-md);
      padding: 1.1rem 1.2rem;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .kpi-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--text-secondary);
      font-size: 0.8rem;
      font-weight: 600;
    }

    .kpi-value {
      font-size: 1.65rem;
      font-family: var(--font-display);
      font-weight: 800;
      margin: 0.4rem 0 0.2rem;
      color: var(--text-primary);
    }

    .kpi-foot {
      font-size: 0.76rem;
      color: var(--text-muted);
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
      margin-bottom: 1.25rem;
    }

    .card-header {
      padding: 0.9rem 1.2rem;
      border-bottom: 1px solid var(--border-light);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      flex-wrap: wrap;
      background: #fff;
    }

    .card-title {
      font-size: 1rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .card-body {
      padding: 1.2rem;
    }

    .table-wrap {
      width: 100%;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.84rem;
    }

    th {
      background: var(--bg-subtle);
      color: var(--text-secondary);
      font-weight: 700;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      padding: 0.72rem 0.9rem;
      border-bottom: 1px solid var(--border-light);
      white-space: nowrap;
    }

    td {
      padding: 0.72rem 0.9rem;
      border-bottom: 1px solid var(--border-light);
      vertical-align: middle;
    }

    tr:hover td {
      background: #f8fafc;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1.2rem;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.1rem;
    }

    @media (max-width: 1024px) {
      .grid-2, .grid-3 { grid-template-columns: 1fr; }
    }

    /* Room Rack Tiles */
    .room-rack-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(185px, 1fr));
      gap: 0.85rem;
    }

    .room-tile {
      border-radius: var(--radius-md);
      border: 1px solid var(--border-light);
      padding: 0.85rem;
      background: #fff;
      cursor: pointer;
      transition: transform 0.14s, box-shadow 0.14s;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 132px;
      position: relative;
    }

    .room-tile:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }

    .room-tile.status-Available { border-left: 4px solid #16a34a; }
    .room-tile.status-Occupied  { border-left: 4px solid #2563eb; background: #eff6ff44; }
    .room-tile.status-Dirty     { border-left: 4px solid #d97706; background: #fffbeb66; }
    .room-tile.status-Maintenance { border-left: 4px solid #dc2626; background: #fef2f266; }
    .room-tile.status-Reserved  { border-left: 4px solid #7c3aed; }

    /* Custom Modals & Toasts */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.62);
      backdrop-filter: blur(2px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      z-index: 100;
      animation: fadeIn 0.15s ease;
    }

    .modal-box {
      background: #fff;
      border-radius: var(--radius-lg);
      width: 100%;
      max-width: 580px;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow-lg);
      overflow: hidden;
    }

    .modal-box.modal-lg {
      max-width: 820px;
    }

    .modal-header {
      padding: 1rem 1.3rem;
      border-bottom: 1px solid var(--border-light);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .modal-body {
      padding: 1.3rem;
      overflow-y: auto;
    }

    .modal-footer {
      padding: 0.9rem 1.3rem;
      border-top: 1px solid var(--border-light);
      background: var(--bg-subtle);
      display: flex;
      justify-content: flex-end;
      gap: 0.6rem;
    }

    .toast-container {
      position: fixed;
      bottom: 1.25rem;
      right: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
      z-index: 200;
      max-width: 390px;
    }

    .toast {
      background: #0f172a;
      color: #fff;
      padding: 0.8rem 1rem;
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-lg);
      display: flex;
      align-items: flex-start;
      gap: 0.65rem;
      font-size: 0.84rem;
      border-left: 4px solid #f59e0b;
      animation: slideUp 0.2s ease;
    }
    .toast.success { border-left-color: #22c55e; }
    .toast.error   { border-left-color: #ef4444; }
    .toast.warning { border-left-color: #f59e0b; }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideUp { from { transform: translateY(12px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

    /* Filter Toolbar */
    .filter-bar {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      flex-wrap: wrap;
      margin-bottom: 1rem;
    }
    .filter-bar .form-control {
      width: auto;
      min-width: 180px;
    }

    /* Mobile Sidebar Toggle */
    .mobile-menu-btn {
      display: none;
    }
    @media (max-width: 960px) {
      .mobile-menu-btn { display: inline-flex; }

        position: fixed;
        top: 0;
        bottom: 0;
        left: 0;
        height: 100vh;
        transform: translateX(-100%);
      }
      .sidebar.open {
        transform: translateX(0);
      }
    }

      display: inline-flex;
      background: var(--bg-subtle);
      border: 1px solid var(--border-medium);
      border-radius: var(--radius-sm);
      padding: 3px;
      gap: 3px;
    }
    .rack-tab-btn {
      padding: 0.36rem 0.75rem;

      border-radius: 4px;
      background: transparent;
      color: var(--text-secondary);

      font-size: 0.8rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;

      color: var(--text-primary);
      box-shadow: var(--shadow-sm);
    }

      width: 100%;
      height: 22px;
      background: var(--bg-subtle);
      border-radius: 6px;
      overflow: hidden;
      display: flex;
      border: 1px solid var(--border-light);
    }
    .chart-seg {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      font-weight: 700;
      color: #fff;
      transition: width 0.25s ease;
    }
    .instant-room-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.35rem 0.65rem;
      border-radius: 6px;
      background: var(--status-success-bg);
      color: var(--status-success-text);
      border: 1px solid #86efac;
      font-weight: 700;
      font-size: 0.78rem;
      cursor: pointer;
      transition: transform 0.12s, box-shadow 0.12s;
    }
    .instant-room-pill:hover {
      transform: translateY(-1px);
      box-shadow: var(--shadow-sm);
      background: #bbf7d0;
    }
      .sidebar.open {

    .guide-module-card {
      border: 1px solid var(--border-light);
      border-radius: var(--radius-md);
      background: #fff;
      padding: 1.25rem;
      margin-bottom: 1.1rem;
    }
    .guide-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-top: 0.85rem;

    .guide-box {
      background: var(--bg-subtle);
      padding: 0.85rem 1rem;
      border-radius: var(--radius-sm);
      font-size: 0.83rem;

      font-size: 0.82rem;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      color: var(--accent-primary);
      margin-bottom: 0.45rem;
    }
    .guide-box ul {
      padding-left: 1.15rem;
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }

    function hasPerm(roleId, requiredPerm) {
      const role = ROLES[roleId];
      if (!role) return false;
      if (role.permissions.includes('*')) return true;
      if (Array.isArray(requiredPerm)) {
        return requiredPerm.some(p => p === '*' ? false : role.permissions.includes(p));
      }
      return role.permissions.includes(requiredPerm);
    }

        if (raw) {
          const parsed = JSON.parse(raw);
          const seed = generateSeedDatabase();
          db = { ...seed, ...(parsed.db || {}) };
          if (parsed.session) {
            session.currentUser = parsed.session.currentUser || null;
            session.activePropertyId = parsed.session.activePropertyId || 'ALL';
            session.activeMainModule = parsed.session.activeMainModule || 'dashboard';
            session.activeSubModule = parsed.session.activeSubModule || 'exec_overview';
            session.expandedMenus = { ...session.expandedMenus, ...(parsed.session.expandedMenus || {}) };
            session.bugMode = Boolean(parsed.session.bugMode);
            session.rackViewMode = parsed.session.rackViewMode || 'grid';
          }
          return;
        }
      } catch (err) {
        console.error('State load fallback:', err);
      }
      db = generateSeedDatabase();
      saveState();
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          db,
          session: {
            currentUser: session.currentUser,
            activePropertyId: session.activePropertyId,
            activeMainModule: session.activeMainModule,
            activeSubModule: session.activeSubModule,
            expandedMenus: session.expandedMenus,
            bugMode: session.bugMode
          }
        }));
      } catch (err) {
        showToast('Storage quota warning while saving state.', 'error');
      }
    }

    function logAudit(moduleName, actionText) {
      const now = new Date();
      const ts = `${now.toISOString().split('T')[0]} ${now.toTimeString().slice(0, 5)}`;
      const actor = session.currentUser
        ? `${session.currentUser.name} (${ROLES[session.currentUser.role]?.short || session.currentUser.role})`
        : 'System';
      db.auditLogs.unshift({
        id: `LOG-${1000 + db.auditLogs.length + 1}`,
        timestamp: ts,
        actor,
        module: moduleName,
        action: actionText
      });
    }

    // --------------------------------------------------------------------------
    // 6. CUSTOM TOASTS & CUSTOM MODALS (ZERO NATIVE ALERT/CONFIRM)
    // --------------------------------------------------------------------------
    function showToast(message, type = 'success') {
      const root = document.getElementById('toast-root');
      if (!root) return;
      const el = document.createElement('div');
      el.className = `toast ${type}`;
      el.innerHTML = `
        <div style="flex:1;">
          <div style="font-weight:700;font-size:0.8rem;text-transform:uppercase;opacity:0.85;margin-bottom:2px;">
            ${type === 'error' ? 'Action Blocked' : type === 'warning' ? 'Notice' : 'Confirmed'}
          </div>
          <div>${escapeHtml(message)}</div>
        </div>
      `;
      root.appendChild(el);
      setTimeout(() => {
        el.style.opacity = '0';
        el.style.transition = 'opacity 0.25s';
        setTimeout(() => el.remove(), 260);
      }, 3600);
    }

      const root = document.getElementById('modal-root');

    function closeCustomModal() {
      const root = document.getElementById('modal-root');

    // --------------------------------------------------------------------------
    // 7. HELPERS (Formatting, Password Eye Field, Property Filter)
    // --------------------------------------------------------------------------
    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function formatCurrency(val) {
      const n = Number(val) || 0;
      return '₹' + n.toLocaleString('en-IN', { maximumFractionDigits: 0 });
    }

    function renderPasswordField({ id, name = '', value = '', placeholder = 'Enter password', required = true }) {
      return `
        <div class="pwd-wrapper">
          <input type="password" class="form-control" id="${id}" name="${name}" value="${escapeHtml(value)}" placeholder="${escapeHtml(placeholder)}" ${required ? 'required' : ''} />
          <button type="button" class="pwd-eye-btn" data-pwd-target="${id}" title="Show / Hide Password" aria-label="Toggle Password Visibility">
            ${ICONS.eye}
          </button>
        </div>
      `;
    }

    function bindPasswordToggles(container = document) {
      container.querySelectorAll('.pwd-eye-btn').forEach(btn => {
        btn.onclick = () => {
          const targetId = btn.getAttribute('data-pwd-target');
          const input = document.getElementById(targetId);
          if (!input) return;
          if (input.type === 'password') {
            input.type = 'text';
            btn.innerHTML = ICONS.eyeOff;
          } else {
            input.type = 'password';
            btn.innerHTML = ICONS.eye;
          }
        };
      });
    }

    function filterByProperty(list) {
      if (!session.activePropertyId || session.activePropertyId === 'ALL') return list;
      return list.filter(item => item.propertyId === session.activePropertyId);
    }

    function getPropName(propId) {
      const p = db.properties.find(x => x.id === propId);
      return p ? p.name : propId;
    }

    function getGuest(guestId) {
      return db.guests.find(g => g.id === guestId) || { fullName: 'Unknown Guest', phone: '-', vipTier: 'Regular', idType: '-', idNumber: '-' };
    }

    function getRoom(roomId) {
      return db.rooms.find(r => r.id === roomId) || { roomNumber: 'N/A', roomTypeId: 'RT-STD', floor: '-' };
    }

    function getRoomType(rtId) {
      return db.roomTypes.find(t => t.id === rtId) || { name: 'Standard', baseRate: 4500 };
    }

    function recalculateFolio(folio) {
      const totalBilled = folio.items.reduce((sum, it) => sum + Number(it.amount || 0) + Number(it.tax || 0), 0);
      folio.balance = totalBilled - Number(folio.paidAmount || 0);
      return totalBilled;
    }

    // ==========================================================================
    // MODULE 2A: INTERACTIVE ROOM RACK / VISUAL AVAILABILITY CHART / FLOOR MATRIX
    // ==========================================================================
    function renderRoomRackModule(container) {
      const allPropRooms = filterByProperty(db.rooms);
      let rooms = allPropRooms;

      if (session.filters.roomStatus !== 'ALL') {
        if (session.filters.roomStatus === 'InstantAvailable') {
          rooms = rooms.filter(r => r.status === 'Available' && r.hkStatus === 'Clean');
        } else if (session.filters.roomStatus === 'Dirty') {
          rooms = rooms.filter(r => r.hkStatus === 'Dirty');
        } else {
          rooms = rooms.filter(r => r.status === session.filters.roomStatus);
        }
      }

      const instantAvailRooms = allPropRooms.filter(r => r.status === 'Available' && r.hkStatus === 'Clean');
      const occupiedCount = allPropRooms.filter(r => r.status === 'Occupied').length;
      const reservedCount = allPropRooms.filter(r => r.status === 'Reserved').length;
      const dirtyCount = allPropRooms.filter(r => r.hkStatus === 'Dirty').length;
      const maintCount = allPropRooms.filter(r => r.status === 'Maintenance').length;
      const totalCount = allPropRooms.length || 1;
      const availPct = Math.round((instantAvailRooms.length / totalCount) * 100);

      // Build Visual Availability Chart HTML
      const visualChartHtml = `
        <div class="kpi-grid">
          <div class="kpi-card">
            <div class="kpi-top"><span>Instant Available (Vacant Clean)</span><span class="badge badge-success">${availPct}% Ready</span></div>
            <div class="kpi-value num" style="color:#15803d;">${instantAvailRooms.length} Rooms</div>
            <div class="kpi-foot">Ready for immediate walk-in check-in</div>
          </div>
          <div class="kpi-card">
            <div class="kpi-top"><span>Occupied (In-House)</span><span class="badge badge-info">${Math.round((occupiedCount/totalCount)*100)}%</span></div>
            <div class="kpi-value num">${occupiedCount} Rooms</div>
            <div class="kpi-foot">Active guest stays</div>
          </div>
          <div class="kpi-card">
            <div class="kpi-top"><span>Dirty / Turnover Due</span><span class="badge badge-warning">Housekeeping</span></div>
            <div class="kpi-value num">${dirtyCount} Rooms</div>
            <div class="kpi-foot">Awaiting HK cleaning & inspection</div>
          </div>
          <div class="kpi-card">
            <div class="kpi-top"><span>Reserved / Maintenance</span><span class="badge badge-purple">${reservedCount} Res • ${maintCount} OOO</span></div>
            <div class="kpi-value num">${reservedCount + maintCount} Rooms</div>
            <div class="kpi-foot">Blocked for arrivals or engineering</div>
          </div>
        </div>

        <div class="card">
          <div class="card-header">
            <div class="card-title">${ICONS.bed} Instant Available Rooms — Click Any Room Pill for Immediate Check-In</div>
            <span class="badge badge-success">${instantAvailRooms.length} Vacant Clean Rooms</span>
          </div>
          <div class="card-body">
            ${instantAvailRooms.length === 0
              ? `<p style="color:var(--text-muted);font-size:0.86rem;">No vacant clean rooms currently available in this property filter.</p>`
              : `<div style="display:flex;flex-wrap:wrap;gap:0.5rem;">
                  ${instantAvailRooms.map(r => {
                    const rt = getRoomType(r.roomTypeId);
                    return `
                      <button type="button" class="instant-room-pill" data-room-id="${r.id}">
                        <span>#${escapeHtml(r.roomNumber)}</span>
                        <span style="opacity:0.8;font-weight:500;">(${rt.code} • ${escapeHtml(getPropName(r.propertyId).split('-')[0].trim().split(' ').pop())})</span>
                        <span>${formatCurrency(rt.baseRate)}</span>
                      </button>
                    `;
                  }).join('')}
                </div>`
            }
          </div>
        </div>

        <div class="grid-2">
          <div class="card">
            <div class="card-header"><div class="card-title">${ICONS.chart} Availability Breakdown by Room Category</div></div>
            <div class="card-body" style="display:flex;flex-direction:column;gap:0.95rem;">
              ${db.roomTypes.map(rt => {
                const catRooms = allPropRooms.filter(r => r.roomTypeId === rt.id);
                const cTotal = catRooms.length || 1;
                const cAvail = catRooms.filter(r => r.status === 'Available' && r.hkStatus === 'Clean').length;
                const cOcc = catRooms.filter(r => r.status === 'Occupied').length;
                const cOther = Math.max(0, catRooms.length - cAvail - cOcc);
                return `
                  <div>
                    <div style="display:flex;justify-content:space-between;font-size:0.82rem;margin-bottom:4px;">
                      <strong>${escapeHtml(rt.name)} (${rt.code})</strong>
                      <span class="num"><strong style="color:#15803d;">${cAvail} Avail</strong> • ${cOcc} Occ • ${cOther} Other (Total ${catRooms.length})</span>
                    </div>
                    <div class="chart-bar-track">
                      <div class="chart-seg" style="width:${(cAvail/cTotal)*100}%;background:#16a34a;" title="Available">${cAvail || ''}</div>
                      <div class="chart-seg" style="width:${(cOcc/cTotal)*100}%;background:#2563eb;" title="Occupied">${cOcc || ''}</div>
                      <div class="chart-seg" style="width:${(cOther/cTotal)*100}%;background:#d97706;" title="Reserved/Dirty/OOO">${cOther || ''}</div>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>

          <div class="card">
            <div class="card-header"><div class="card-title">${ICONS.building} Availability Breakdown by Floor</div></div>
            <div class="card-body" style="display:flex;flex-direction:column;gap:0.95rem;">
              ${['Floor 1', 'Floor 2', 'Floor 3', 'Floor 4'].map(fl => {
                const flRooms = allPropRooms.filter(r => r.floor === fl);
                if (flRooms.length === 0) return '';
                const fTotal = flRooms.length;
                const fAvail = flRooms.filter(r => r.status === 'Available' && r.hkStatus === 'Clean').length;
                const fOcc = flRooms.filter(r => r.status === 'Occupied').length;
                const fOther = Math.max(0, fTotal - fAvail - fOcc);
                return `
                  <div>
                    <div style="display:flex;justify-content:space-between;font-size:0.82rem;margin-bottom:4px;">
                      <strong>${fl}</strong>
                      <span class="num"><strong style="color:#15803d;">${fAvail} Ready</strong> / ${fTotal} Rooms</span>
                    </div>
                    <div class="chart-bar-track">
                      <div class="chart-seg" style="width:${(fAvail/fTotal)*100}%;background:#16a34a;">${fAvail || ''}</div>
                      <div class="chart-seg" style="width:${(fOcc/fTotal)*100}%;background:#2563eb;">${fOcc || ''}</div>
                      <div class="chart-seg" style="width:${(fOther/fTotal)*100}%;background:#d97706;">${fOther || ''}</div>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        </div>
      `;

      // Build Floor Matrix View HTML
      const floorMatrixHtml = `
        <div class="card">
          <div class="card-header"><div class="card-title">Floor-by-Floor Visual Room Strip</div></div>
          <div class="card-body" style="display:flex;flex-direction:column;gap:1rem;">
            ${['Floor 1', 'Floor 2', 'Floor 3', 'Floor 4'].map(fl => {
              const flRooms = rooms.filter(r => r.floor === fl);
              if (flRooms.length === 0) return '';
              return `
                <div style="border:1px solid var(--border-light);border-radius:var(--radius-sm);padding:0.75rem;">
                  <div style="font-weight:700;font-size:0.84rem;margin-bottom:0.55rem;color:var(--text-secondary);">${fl} (${flRooms.length} Rooms)</div>
                  <div style="display:flex;flex-wrap:wrap;gap:0.45rem;">
                    ${flRooms.map(r => {
                      const isInstant = r.status === 'Available' && r.hkStatus === 'Clean';
                      const bg = isInstant ? '#dcfce7' : r.status === 'Occupied' ? '#dbeafe' : r.status === 'Maintenance' ? '#fee2e2' : '#fef3c7';
                      const col = isInstant ? '#166534' : r.status === 'Occupied' ? '#1e40af' : r.status === 'Maintenance' ? '#991b1b' : '#92400e';
                      return `
                        <button type="button" data-room-id="${r.id}" style="padding:0.45rem 0.7rem;border-radius:6px;border:1px solid rgba(0,0,0,0.08);background:${bg};color:${col};font-weight:700;font-size:0.8rem;cursor:pointer;">
                          #${escapeHtml(r.roomNumber)} • ${isInstant ? 'AVAIL' : escapeHtml(r.status.toUpperCase().slice(0,4))}
                        </button>
                      `;
                    }).join('')}
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;

      // Build Standard Grid View HTML
      const gridViewHtml = `
        <div class="room-rack-grid">
          ${rooms.map(r => {
            const rt = getRoomType(r.roomTypeId);
            const activeRes = db.reservations.find(res => res.roomId === r.id && (res.status === 'Checked-In' || res.status === 'Confirmed'));
            const guest = activeRes ? getGuest(activeRes.guestId) : null;
            const statusClass = r.hkStatus === 'Dirty' && r.status === 'Available' ? 'status-Dirty' : `status-${r.status}`;

            return `
              <div class="room-tile ${statusClass}" data-room-id="${r.id}">
                <div>
                  <div style="display:flex;justify-content:space-between;align-items:center;">
                    <strong class="num" style="font-size:1.1rem;">#${escapeHtml(r.roomNumber)}</strong>
                    <span class="badge ${r.status === 'Available' ? 'badge-success' : r.status === 'Occupied' ? 'badge-info' : r.status === 'Maintenance' ? 'badge-danger' : 'badge-purple'}">
                      ${escapeHtml(r.status)}
                    </span>
                  </div>
                  <div style="font-size:0.75rem;color:var(--text-secondary);margin-top:2px;">${escapeHtml(rt.name)}</div>
                  <div style="font-size:0.7rem;color:var(--text-muted);">${escapeHtml(getPropName(r.propertyId).split('-')[0])}</div>
                </div>

                <div style="margin-top:0.55rem;padding-top:0.45rem;border-top:1px dashed var(--border-light);font-size:0.76rem;">
                  ${guest ? `<div style="font-weight:700;color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escapeHtml(guest.fullName)}</div>` : `<div style="color:var(--text-muted);">Vacant • ${formatCurrency(rt.baseRate)}/nt</div>`}
                  <div style="display:flex;justify-content:space-between;margin-top:3px;">
                    <span class="badge ${r.hkStatus === 'Clean' ? 'badge-success' : r.hkStatus === 'Dirty' ? 'badge-warning' : 'badge-danger'}" style="font-size:0.66rem;">HK: ${escapeHtml(r.hkStatus)}</span>
                    <span style="color:var(--text-muted);font-size:0.7rem;">${escapeHtml(r.floor)}</span>
                  </div>
                </div>
              </div>
            `;
          }).join('')}
        </div>
      `;

      container.innerHTML = `
        <div class="page-header">
          <div>
            <h1 class="page-title">Interactive Room Rack & Live Availability Board</h1>
            <p class="page-subtitle">Switch between Card Grid, Visual Availability Chart, or Floor Strip Map to inspect and book rooms instantly.</p>
          </div>
          <div style="display:flex;gap:0.55rem;align-items:center;flex-wrap:wrap;">
            <div class="rack-view-tabs">
              <button type="button" class="rack-tab-btn ${session.rackViewMode === 'grid' ? 'active' : ''}" data-rack-mode="grid">${ICONS.roomRack} Room Grid</button>
              <button type="button" class="rack-tab-btn ${session.rackViewMode === 'chart' ? 'active' : ''}" data-rack-mode="chart">${ICONS.chart} Visual Availability Chart</button>
              <button type="button" class="rack-tab-btn ${session.rackViewMode === 'matrix' ? 'active' : ''}" data-rack-mode="matrix">${ICONS.building} Floor Matrix</button>
            </div>
            ${hasPerm(session.currentUser.role, 'reservations') ? `
              <button class="btn btn-primary" id="rack-walkin-btn">${ICONS.plus} Quick Walk-In Check-In</button>
            ` : ''}
          </div>
        </div>

        <div class="filter-bar">
          <select class="form-control" id="rack-status-filter">
            <option value="ALL" ${session.filters.roomStatus === 'ALL' ? 'selected' : ''}>All Room Statuses (${allPropRooms.length})</option>
            <option value="InstantAvailable" ${session.filters.roomStatus === 'InstantAvailable' ? 'selected' : ''}>Instant Available — Vacant Clean (${instantAvailRooms.length})</option>
            <option value="Available" ${session.filters.roomStatus === 'Available' ? 'selected' : ''}>All Available</option>
            <option value="Occupied" ${session.filters.roomStatus === 'Occupied' ? 'selected' : ''}>Occupied (In-House)</option>
            <option value="Reserved" ${session.filters.roomStatus === 'Reserved' ? 'selected' : ''}>Reserved (Arrival Due)</option>
            <option value="Dirty" ${session.filters.roomStatus === 'Dirty' ? 'selected' : ''}>Dirty (Housekeeping Needed)</option>
            <option value="Maintenance" ${session.filters.roomStatus === 'Maintenance' ? 'selected' : ''}>Maintenance / OOO</option>
          </select>

          <button type="button" class="btn btn-xs ${session.filters.roomStatus === 'InstantAvailable' ? 'btn-success' : 'btn-secondary'}" id="btn-instant-avail-filter">
            Show Only Instant Available (${instantAvailRooms.length})
          </button>
          <span class="badge badge-info">Occupied (${occupiedCount})</span>
          <span class="badge badge-purple">Reserved (${reservedCount})</span>
          <span class="badge badge-warning">Dirty (${dirtyCount})</span>
          <span class="badge badge-danger">Maintenance (${maintCount})</span>
        </div>

        ${session.rackViewMode === 'chart' ? visualChartHtml : session.rackViewMode === 'matrix' ? floorMatrixHtml : gridViewHtml}
      `;

      container.querySelectorAll('[data-rack-mode]').forEach(btn => {
        btn.onclick = () => {
          session.rackViewMode = btn.getAttribute('data-rack-mode');
          saveState();
          renderRoomRackModule(container);
        };
      });

      document.getElementById('btn-instant-avail-filter').onclick = () => {
        session.filters.roomStatus = session.filters.roomStatus === 'InstantAvailable' ? 'ALL' : 'InstantAvailable';
        renderRoomRackModule(container);
      };

      document.getElementById('rack-status-filter').onchange = (e) => {
        session.filters.roomStatus = e.target.value;
        renderRoomRackModule(container);
      };

      const walkinBtn = document.getElementById('rack-walkin-btn');
      if (walkinBtn) walkinBtn.onclick = () => openReservationModal(null, true);

      container.querySelectorAll('[data-room-id]').forEach(tile => {
        tile.onclick = () => openRoomQuickActionModal(tile.getAttribute('data-room-id'));
      });
    }

    function openRoomQuickActionModal(roomId) {
      const room = getRoom(roomId);
      const rt = getRoomType(room.roomTypeId);
      const activeRes = db.reservations.find(res => res.roomId === room.id && res.status === 'Checked-In');
      const guest = activeRes ? getGuest(activeRes.guestId) : null;
      const folio = activeRes ? db.folios.find(f => f.id === activeRes.folioId) : null;
      const canFrontDesk = hasPerm(session.currentUser.role, 'reservations');
      const canHK = hasPerm(session.currentUser.role, 'hk_board');

      openCustomModal({
        title: `Room ${room.roomNumber} — ${rt.name} (${getPropName(room.propertyId)})`,
        bodyHtml: `
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.75rem;margin-bottom:1rem;background:var(--bg-subtle);padding:0.85rem;border-radius:var(--radius-sm);">
            <div><span style="font-size:0.75rem;color:var(--text-muted);">Occupancy Status</span><div><strong>${escapeHtml(room.status)}</strong></div></div>
            <div><span style="font-size:0.75rem;color:var(--text-muted);">Housekeeping Status</span><div><strong>${escapeHtml(room.hkStatus)}</strong></div></div>
            <div><span style="font-size:0.75rem;color:var(--text-muted);">Base Rack Rate</span><div class="num"><strong>${formatCurrency(rt.baseRate)} / night</strong></div></div>
            <div><span style="font-size:0.75rem;color:var(--text-muted);">Attendant</span><div><strong>${escapeHtml(room.assignedAttendant)}</strong></div></div>
          </div>

          ${guest ? `
            <div style="border:1px solid var(--border-light);padding:0.85rem;border-radius:var(--radius-sm);margin-bottom:1rem;">
              <div style="font-size:0.76rem;text-transform:uppercase;color:var(--accent-primary);font-weight:700;">Current In-House Guest</div>
              <div style="font-size:1rem;font-weight:700;margin-top:2px;">${escapeHtml(guest.fullName)} (${escapeHtml(guest.vipTier)})</div>
              <div style="font-size:0.82rem;color:var(--text-secondary);">Stay: ${activeRes.checkIn} to ${activeRes.checkOut} • Reservation: ${activeRes.id}</div>
              ${folio ? `<div style="margin-top:0.4rem;font-size:0.85rem;">Active Folio Balance Due: <strong class="num">${formatCurrency(folio.balance)}</strong></div>` : ''}
            </div>
          ` : ''}

          <div style="display:flex;gap:0.5rem;flex-wrap:wrap;">
            ${room.status === 'Available' && canFrontDesk ? `
              <button class="btn btn-primary btn-sm" id="modal-walkin-room">Walk-In Check-In to Room ${room.roomNumber}</button>
            ` : ''}
            ${activeRes && canFrontDesk ? `
              <button class="btn btn-success btn-sm" id="modal-checkout-room">Proceed to Check-Out</button>
            ` : ''}
            ${canHK ? `
              <button class="btn btn-secondary btn-sm" id="modal-mark-clean">Mark HK Clean</button>
              <button class="btn btn-secondary btn-sm" id="modal-mark-dirty">Mark HK Dirty</button>
            ` : ''}
          </div>
        `,
        footerHtml: `<button class="btn btn-dark" onclick="closeCustomModal()">Close</button>`,
        onMount: () => {
          const wBtn = document.getElementById('modal-walkin-room');
          if (wBtn) wBtn.onclick = () => { closeCustomModal(); openReservationModal(room, true); };

          const cBtn = document.getElementById('modal-checkout-room');
          if (cBtn) cBtn.onclick = () => {
            closeCustomModal();
            session.activeMainModule = 'front_office';
            session.activeSubModule = 'checkout';
            renderApp();
          };

          const cleanBtn = document.getElementById('modal-mark-clean');
          if (cleanBtn) cleanBtn.onclick = () => {
            room.hkStatus = 'Clean';
            if (room.status === 'Maintenance') room.status = 'Available';
            logAudit('Housekeeping', `Marked Room ${room.roomNumber} as Clean`);
            if (!session.bugMode) saveState();
            closeCustomModal();
            renderApp();
            showToast(`Room ${room.roomNumber} marked Clean.`, 'success');
          };

          const dirtyBtn = document.getElementById('modal-mark-dirty');
          if (dirtyBtn) dirtyBtn.onclick = () => {
            room.hkStatus = 'Dirty';
            logAudit('Housekeeping', `Marked Room ${room.roomNumber} as Dirty`);
            saveState();
            closeCustomModal();
            renderApp();
            showToast(`Room ${room.roomNumber} marked Dirty.`, 'warning');
          };
        }
      });
    }

    // ==========================================================================
    // MODULE 2B: RESERVATIONS & WALK-IN CHECK-IN
    // ==========================================================================
    function renderReservationsModule(container) {
      let list = filterByProperty(db.reservations);
      if (session.filters.resStatus !== 'ALL') {
        list = list.filter(r => r.status === session.filters.resStatus);
      }
      if (session.filters.resSearch) {
        const q = session.filters.resSearch.toLowerCase();
        list = list.filter(r => {
          const g = getGuest(r.guestId);
          const rm = getRoom(r.roomId);
          return r.id.toLowerCase().includes(q) || g.fullName.toLowerCase().includes(q) || rm.roomNumber.includes(q);
        });
      }

      const canEdit = hasPerm(session.currentUser.role, 'reservations');

      container.innerHTML = `
        <div class="page-header">
          <div>
            <h1 class="page-title">Reservations & Walk-In Check-In</h1>
            <p class="page-subtitle">Manage bookings across OTAs, corporate desks, and direct walk-ins. Check-in activates room occupancy and guest folios.</p>
          </div>
          ${canEdit ? `
            <button class="btn btn-primary" id="btn-create-res">${ICONS.plus} Create Reservation / Walk-In</button>
          ` : ''}
        </div>

        <div class="filter-bar">
          <input type="text" class="form-control" id="res-search-input" placeholder="Search Res ID, Guest, Room..." value="${escapeHtml(session.filters.resSearch)}" />
          <select class="form-control" id="res-status-filter">
            <option value="ALL" ${session.filters.resStatus === 'ALL' ? 'selected' : ''}>All Statuses</option>
            <option value="Checked-In" ${session.filters.resStatus === 'Checked-In' ? 'selected' : ''}>Checked-In (In-House)</option>
            <option value="Confirmed" ${session.filters.resStatus === 'Confirmed' ? 'selected' : ''}>Confirmed (Upcoming)</option>
            <option value="Tentative" ${session.filters.resStatus === 'Tentative' ? 'selected' : ''}>Tentative</option>
            <option value="Checked-Out" ${session.filters.resStatus === 'Checked-Out' ? 'selected' : ''}>Checked-Out</option>
            <option value="Cancelled" ${session.filters.resStatus === 'Cancelled' ? 'selected' : ''}>Cancelled</option>
          </select>
        </div>

        <div class="card">
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Booking ID</th>
                  <th>Guest Name</th>
                  <th>Property & Room</th>
                  <th>Check-In / Out</th>
                  <th>Source</th>
                  <th>Rate / Night</th>
                  <th>Status</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody>
                ${list.slice(0, 45).map(r => {
                  const g = getGuest(r.guestId);
                  const rm = getRoom(r.roomId);
                  const rt = getRoomType(r.roomTypeId);
                  const badgeCls = r.status === 'Checked-In' ? 'badge-info'
                    : r.status === 'Confirmed' ? 'badge-success'
                    : r.status === 'Tentative' ? 'badge-warning'
                    : r.status === 'Cancelled' ? 'badge-danger' : 'badge-neutral';

                  return `
                    <tr>
                      <td><strong>${escapeHtml(r.id)}</strong><div style="font-size:0.72rem;color:var(--text-muted);">${escapeHtml(r.folioId)}</div></td>
                      <td><strong>${escapeHtml(g.fullName)}</strong><div style="font-size:0.74rem;color:var(--text-muted);">${escapeHtml(g.phone)}</div></td>
                      <td><strong>Room ${escapeHtml(rm.roomNumber)}</strong> (${escapeHtml(rt.code)})<div style="font-size:0.73rem;color:var(--text-muted);">${escapeHtml(getPropName(r.propertyId).split('-')[0])}</div></td>
                      <td class="num">${escapeHtml(r.checkIn)} → ${escapeHtml(r.checkOut)}<div style="font-size:0.73rem;color:var(--text-muted);">${r.nights} Night(s)</div></td>
                      <td>${escapeHtml(r.source)}</td>
                      <td class="num"><strong>${formatCurrency(r.ratePerNight)}</strong></td>
                      <td><span class="badge ${badgeCls}">${escapeHtml(r.status)}</span></td>
                      <td>
                        <div style="display:flex;gap:0.35rem;flex-wrap:wrap;">
                          ${canEdit && (r.status === 'Confirmed' || r.status === 'Tentative') ? `
                            <button class="btn btn-success btn-xs" data-checkin-id="${r.id}">Check-In</button>
                          ` : ''}
                          ${canEdit && r.status !== 'Checked-Out' && r.status !== 'Cancelled' ? `
                            <button class="btn btn-danger btn-xs" data-cancel-res="${r.id}">Cancel</button>
                          ` : ''}
                        </div>
                      </td>
                    </tr>
                  `;
                }).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;

      const createBtn = document.getElementById('btn-create-res');
      if (createBtn) createBtn.onclick = () => openReservationModal();

      document.getElementById('res-search-input').oninput = (e) => {
        session.filters.resSearch = e.target.value;
        renderReservationsModule(container);
      };

      document.getElementById('res-status-filter').onchange = (e) => {
        session.filters.resStatus = e.target.value;
        renderReservationsModule(container);
      };

      container.querySelectorAll('[data-checkin-id]').forEach(btn => {
        btn.onclick = () => {
          const res = db.reservations.find(x => x.id === btn.getAttribute('data-checkin-id'));
          if (!res) return;
          const rm = getRoom(res.roomId);
          if (rm.status === 'Occupied' && !session.bugMode) {
            showToast(`Room ${rm.roomNumber} is currently Occupied! Reassign room before check-in.`, 'error');
            return;
          }
          res.status = 'Checked-In';
          rm.status = 'Occupied';
          logAudit('Front Office', `Checked-In ${res.id} (${getGuest(res.guestId).fullName}) into Room ${rm.roomNumber}`);
          saveState();
          renderApp();
          showToast(`Guest checked into Room ${rm.roomNumber}! Folio ${res.folioId} is active.`, 'success');
        };
      });

      container.querySelectorAll('[data-cancel-res]').forEach(btn => {
        btn.onclick = () => {
          const resId = btn.getAttribute('data-cancel-res');
          confirmCustomDialog({
            title: `Cancel Reservation ${resId}?`,
            message: 'Cancelling this reservation will release the assigned room back to Available inventory.',
            confirmLabel: 'Cancel Reservation',
            danger: true,
            onConfirm: () => {
              const res = db.reservations.find(x => x.id === resId);
              if (res) {
                res.status = 'Cancelled';
                const rm = getRoom(res.roomId);
                if (rm && rm.status === 'Reserved') rm.status = 'Available';
                logAudit('Front Office', `Cancelled reservation ${res.id}`);
                saveState();
                renderApp();
                showToast(`Reservation ${res.id} cancelled.`, 'warning');
              }
            }
          });
        };
      });
    }

    function openReservationModal(preselectedRoom = null, immediateCheckIn = false) {
      const defaultProp = preselectedRoom ? preselectedRoom.propertyId : (session.activePropertyId !== 'ALL' ? session.activePropertyId : 'PROP-MUM');

      function getSelectableRoomsForProp(propId) {
        const allForProp = db.rooms.filter(r => r.propertyId === propId);
        // Unless QA Bug Mode is ON, ONLY show Vacant Clean Available rooms (plus any explicitly preselected room)
        if (session.bugMode) return allForProp;
        return allForProp.filter(r => (r.status === 'Available' && r.hkStatus === 'Clean') || (preselectedRoom && r.id === preselectedRoom.id));
      }

      const initialRooms = getSelectableRoomsForProp(defaultProp);

      openCustomModal({
        title: immediateCheckIn ? 'Walk-In Registration & Immediate Check-In' : 'Create New Room Reservation',
        large: true,
        bodyHtml: `
          <form id="new-res-form">
            <div class="grid-2">
              <div class="form-group">
                <label class="form-label">Property</label>
                <select class="form-control" id="res-prop">
                  ${db.properties.map(p => `<option value="${p.id}" ${p.id === defaultProp ? 'selected' : ''}>${escapeHtml(p.name)}</option>`).join('')}
                </select>
              </div>
              <div class="form-group">
                <label class="form-label">Select Guest</label>
                <select class="form-control" id="res-guest">
                  ${db.guests.map(g => `<option value="${g.id}">${escapeHtml(g.fullName)} (${escapeHtml(g.phone)})</option>`).join('')}
                </select>
              </div>
            </div>

            <div class="grid-2">
              <div class="form-group">
                <label class="form-label" style="display:flex;justify-content:space-between;">
                  <span>Assign Available Room</span>
                  <span class="badge badge-success" id="avail-room-count-badge">${initialRooms.length} Available</span>
                </label>
                <select class="form-control" id="res-room">
                  ${initialRooms.length === 0
                    ? `<option value="">No Vacant Clean Rooms Available in This Property</option>`
                    : initialRooms.map(r => {
                        const rt = getRoomType(r.roomTypeId);
                        return `<option value="${r.id}" ${preselectedRoom && preselectedRoom.id === r.id ? 'selected' : ''}>Room ${r.roomNumber} (${r.floor}) — ${rt.name} • ₹${rt.baseRate}/nt</option>`;
                      }).join('')
                  }
                </select>
              </div>
              <div class="form-group">
                <label class="form-label">Booking Source & Promo Code</label>
                <div style="display:flex;gap:0.4rem;">
                  <select class="form-control" id="res-source">
                    <option value="Walk-In">Walk-In</option>
                    <option value="Direct Website">Direct Website</option>
                    <option value="Booking.com">Booking.com</option>
                    <option value="MakeMyTrip">MakeMyTrip</option>
                    <option value="Corporate Desk">Corporate Desk</option>
                  </select>
                  <select class="form-control" id="res-promo">
                    <option value="">No Promo</option>
                    ${db.promoCodes.filter(p => p.active).map(p => `<option value="${p.code}">${p.code} (-${p.discountPct}%)</option>`).join('')}
                  </select>
                </div>
              </div>
            </div>

            <div class="grid-3">
              <div class="form-group">
                <label class="form-label">Check-In Date</label>
                <input type="date" class="form-control" id="res-checkin" value="${db.systemSettings.businessDate}" required />
              </div>
              <div class="form-group">
                <label class="form-label">Check-Out Date</label>
                <input type="date" class="form-control" id="res-checkout" value="${todayOffset(2)}" required />
              </div>
              <div class="form-group">
                <label class="form-label">Booking Action</label>
                <select class="form-control" id="res-mode">
                  <option value="Checked-In" ${immediateCheckIn ? 'selected' : ''}>Immediate Check-In</option>
                  <option value="Confirmed" ${!immediateCheckIn ? 'selected' : ''}>Confirmed Reservation</option>
                </select>
              </div>
            </div>

            <div class="form-group">
              <label class="form-label">Advance Deposit Paid Now (₹)</label>
              <input type="number" class="form-control" id="res-advance" value="2500" min="0" />
            </div>
          </form>
        `,
        footerHtml: `
          <button class="btn btn-secondary" onclick="closeCustomModal()">Cancel</button>
          <button class="btn btn-primary" id="save-res-submit">Save & Confirm Booking</button>
        `,
        onMount: () => {
          document.getElementById('res-prop').onchange = (e) => {
            const pid = e.target.value;
            const filtered = getSelectableRoomsForProp(pid);
            const badge = document.getElementById('avail-room-count-badge');
            if (badge) badge.textContent = `${filtered.length} Available`;
            document.getElementById('res-room').innerHTML = filtered.length === 0
              ? `<option value="">No Vacant Clean Rooms Available in This Property</option>`
              : filtered.map(r => {
                  const rt = getRoomType(r.roomTypeId);
                  return `<option value="${r.id}">Room ${r.roomNumber} (${r.floor}) — ${rt.name} • ₹${rt.baseRate}/nt</option>`;
                }).join('');
          };

          document.getElementById('save-res-submit').onclick = () => {
            const propId = document.getElementById('res-prop').value;
            const guestId = document.getElementById('res-guest').value;
            const roomId = document.getElementById('res-room').value;
            if (!roomId) {
              showToast('Please select an available room before confirming.', 'error');
              return;
            }
            const source = document.getElementById('res-source').value;
            const promoCode = document.getElementById('res-promo').value;
            const checkIn = document.getElementById('res-checkin').value;
            const checkOut = document.getElementById('res-checkout').value;
            const mode = document.getElementById('res-mode').value;
            const advance = Number(document.getElementById('res-advance').value || 0);

            const room = getRoom(roomId);
            const rt = getRoomType(room.roomTypeId);

            // Standard Validations (Bypassed when QA Bug Mode is ON!)
            if (!session.bugMode) {
              if (checkOut <= checkIn) {
                showToast('Validation Error: Check-Out date must be strictly after Check-In date.', 'error');
                return;
              }
              if (room.status === 'Occupied' || room.status === 'Maintenance') {
                showToast(`Room ${room.roomNumber} is currently ${room.status} and cannot be booked.`, 'error');
                return;
              }
            }

            const nights = Math.max(1, Math.round((new Date(checkOut) - new Date(checkIn)) / 86400000));
            let rate = rt.baseRate;
            if (promoCode) {
              const prm = db.promoCodes.find(p => p.code === promoCode);
              if (prm) {
                prm.uses += 1;
                rate = Math.round(rate * (1 - prm.discountPct / 100));
              }
            }

            const resId = `RES-${1001 + db.reservations.length}`;
            const folioId = `FOL-${1001 + db.reservations.length}`;
            const roomTotal = rate * nights;
            const taxTotal = Math.round(roomTotal * 0.12);

            db.reservations.unshift({
              id: resId,
              propertyId: propId,
              guestId,
              roomId,
              roomTypeId: room.roomTypeId,
              checkIn,
              checkOut,
              nights,
              adults: 2,
              children: 0,
              source,
              ratePerNight: rate,
              status: mode,
              folioId,
              specialRequests: '',
              createdAt: db.systemSettings.businessDate
            });

            room.status = mode === 'Checked-In' ? 'Occupied' : 'Reserved';

            db.folios.unshift({
              id: folioId,
              reservationId: resId,
              propertyId: propId,
              guestId,
              roomNumber: room.roomNumber,
              status: 'Open',
              items: [
                { id: `FI-${Date.now()}`, date: checkIn, category: 'Room Tariff', description: `${rt.name} (${nights} Nights @ ₹${rate})`, amount: roomTotal, tax: taxTotal }
              ],
              paidAmount: advance,
              balance: roomTotal + taxTotal - advance
            });

            if (advance > 0) {
              db.payments.unshift({
                id: `PAY-${Date.now().toString().slice(-5)}`,
                folioId,
                propertyId: propId,
                guestName: getGuest(guestId).fullName,
                date: db.systemSettings.businessDate,
                method: 'Card / UPI',
                reference: `ADV${Date.now().toString().slice(-6)}`,
                amount: advance,
                type: 'Advance Deposit'
              });
            }

            logAudit('Front Office', `Created ${mode} booking ${resId} for ${getGuest(guestId).fullName} in Room ${room.roomNumber}`);
            saveState();
            closeCustomModal();
            renderApp();
            showToast(`Booking ${resId} (${mode}) saved! Room ${room.roomNumber} & Folio ${folioId} updated.`, 'success');
          };
        }
      });
    }

              const conflict = db.banquetEvents.find(e => e.id !== existing?.id && e.propertyId === propertyId && e.hallName === hallName && e.eventDate === eventDate && e.slot === slot);
              if (conflict) {
                showToast(`Venue Conflict: ${hallName} is already booked on ${eventDate} (${slot}).`, 'error');
                return;
              }
            }

            if (existing) {
              Object.assign(existing, { propertyId, hallName, eventName, clientName, eventDate, slot, pax, packageRate, advancePaid, status });
              logAudit('Banquet & Events', `Updated banquet booking ${existing.id} (${eventName})`);
            } else {
              db.banquetEvents.unshift({
                id: `BNQ-${301 + db.banquetEvents.length}`,
                propertyId, hallName, eventName, clientName, clientPhone: '+91 98200 11223',
                eventDate, slot, pax, packageRate, advancePaid, status
              });
              logAudit('Banquet & Events', `Booked ${hallName} for ${eventName} on ${eventDate}`);
            }
            saveState();
            closeCustomModal();
            renderApp();
            showToast(`Banquet event "${eventName}" saved!`, 'success');
          };
        }
      });
    }

    // MODULE 2D: EXPRESS CHECK-OUT DESK

    function renderCheckoutModule(container) {
      const inHouse = filterByProperty(db.reservations).filter(r => r.status === 'Checked-In');

      container.innerHTML = `
        <div class="page-header">
          <div>
            <h1 class="page-title">Express Check-Out & Folio Settlement Desk</h1>
            <p class="page-subtitle">Settle open balances, generate final tax invoices, award loyalty points, and trigger automatic housekeeping turnover.</p>
          </div>
        </div>

        <div class="card">
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Room</th>
                  <th>Guest</th>
                  <th>Stay Dates</th>
                  <th>Total Billed</th>
                  <th>Paid</th>
                  <th>Balance Due</th>
                  <th>Checkout Actions</th>
                </tr>
              </thead>
              <tbody>
                ${inHouse.length === 0 ? `<tr><td colspan="7" style="text-align:center;padding:2rem;color:var(--text-muted);">No in-house guests currently checked in for this property filter.</td></tr>` : ''}
                ${inHouse.map(res => {
                  const guest = getGuest(res.guestId);
                  const room = getRoom(res.roomId);
                  const folio = db.folios.find(f => f.id === res.folioId);
                  const totalBilled = folio ? recalculateFolio(folio) : 0;
                  const balance = folio ? folio.balance : 0;

                  return `
                    <tr>
                      <td><strong>Room ${escapeHtml(room.roomNumber)}</strong><div style="font-size:0.73rem;color:var(--text-muted);">${escapeHtml(getPropName(res.propertyId).split('-')[0])}</div></td>
                      <td><strong>${escapeHtml(guest.fullName)}</strong><div style="font-size:0.74rem;color:var(--text-muted);">${escapeHtml(res.id)}</div></td>
                      <td class="num">${res.checkIn} → ${res.checkOut}</td>
                      <td class="num">${formatCurrency(totalBilled)}</td>
                      <td class="num">${formatCurrency(folio ? folio.paidAmount : 0)}</td>
                      <td class="num"><span class="badge ${balance > 0 ? 'badge-danger' : 'badge-success'}">${formatCurrency(balance)}</span></td>
                      <td>
                        <div style="display:flex;gap:0.4rem;flex-wrap:wrap;">
                          ${balance > 0 ? `<button class="btn btn-secondary btn-xs" data-settle-folio="${folio.id}">Settle Due</button>` : ''}
                          <button class="btn btn-primary btn-xs" data-complete-checkout="${res.id}">Complete Check-Out</button>
                        </div>
                      </td>
                    </tr>
                  `;
                }).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;

      container.querySelectorAll('[data-settle-folio]').forEach(btn => {
        btn.onclick = () => openSettlePaymentModal(btn.getAttribute('data-settle-folio'));
      });

      container.querySelectorAll('[data-complete-checkout]').forEach(btn => {
        btn.onclick = () => {
          const res = db.reservations.find(r => r.id === btn.getAttribute('data-complete-checkout'));
          if (!res) return;
          const folio = db.folios.find(f => f.id === res.folioId);
          recalculateFolio(folio);

          // Enforce zero-balance checkout unless QA Bug Mode is active!
          if (!session.bugMode && folio.balance > 0) {
            showToast(`Cannot Check-Out: Folio ${folio.id} has an unsettled balance of ${formatCurrency(folio.balance)}. Please collect payment first.`, 'error');
            return;
          }

          res.status = 'Checked-Out';
          folio.status = 'Settled';
          const room = getRoom(res.roomId);
          room.status = 'Available';
          if (db.systemSettings.autoMarkDirtyOnCheckout) {
            room.hkStatus = 'Dirty';
          }
          const guest = getGuest(res.guestId);
          guest.totalStays += 1;
          guest.loyaltyPoints += 300;

          logAudit('Front Office', `Checked-Out ${guest.fullName} from Room ${room.roomNumber}. Room marked Dirty for Housekeeping.`);
          saveState();
          renderApp();
          showToast(`Check-Out complete for ${guest.fullName}! Room ${room.roomNumber} is now Dirty in Housekeeping.`, 'success');
        };
      });
    }

      recalculateFolio(folio);

      openCustomModal({
        title: `Record Folio Payment — ${folio.id} (Room ${folio.roomNumber})`,
        bodyHtml: `

            <label class="form-label">Amount to Collect (₹) — Current Due: ${formatCurrency(folio.balance)}</label>
            <input type="number" class="form-control" id="pay-amt" value="${Math.max(0, folio.balance)}" />
          </div>
          <div class="form-group">
            <label class="form-label">Payment Mode</label>
            <select class="form-control" id="pay-method">
              <option value="Credit Card">Credit / Debit Card (POS Terminal)</option>
              <option value="UPI / QR">UPI / QR Instant</option>
              <option value="Cash">Cash Counter</option>
              <option value="Corporate Bill">Corporate Direct Bill</option>
            </select>
          </div>

            const amt = Number(document.getElementById('pay-amt').value || 0);
            const method = document.getElementById('pay-method').value;
            const ref = document.getElementById('pay-ref').value.trim();
            if (amt <= 0) {

            recalculateFolio(folio);

              id: `PAY-${Date.now().toString().slice(-5)}`,
              folioId: folio.id,
              propertyId: folio.propertyId,

              method,
              reference: ref,
              amount: amt,
              type: 'Folio Settlement'
            });
            logAudit('Billing & Folio', `Collected ${formatCurrency(amt)} via ${method} for Folio ${folio.id}`);

            closeCustomModal();
            renderApp();
            showToast(`Payment of ${formatCurrency(amt)} recorded on ${folio.id}.`, 'success');

            document.getElementById('save-mnt-btn').onclick = () => {
              const roomNumber = document.getElementById('mnt-room').value.trim();

              db.maintenanceTickets.unshift({
                id: `MNT-${101 + db.maintenanceTickets.length}`,

                status: 'Open', reportedDate: db.systemSettings.businessDate
              });
              const rm = db.rooms.find(r => r.propertyId === propId && r.roomNumber === roomNumber);

      };

    function renderStockLedgerModule(container) {
      const items = filterByProperty(db.inventoryItems);

          <div>
            <h1 class="page-title">Stores, Linen & Amenities Stock Ledger</h1>

              </thead>
              <tbody>
                ${items.map(it => {
                  const low = it.stock <= it.reorderLevel;
                  return `
                    <tr>
                      <td style="font-family:var(--font-mono);">${it.sku}</td>
                      <td><strong>${escapeHtml(it.name)}</strong></td>
                      <td>${escapeHtml(getPropName(it.propertyId).split('-')[0])}</td>
                      <td>${escapeHtml(it.category)}</td>
                      <td class="num"><span class="badge ${low ? 'badge-danger' : 'badge-success'}">${it.stock} ${it.unit}</span></td>
                      <td class="num">${it.reorderLevel} ${it.unit}</td>
                      <td>
                        <div style="display:flex;gap:0.35rem;">
                          <button class="btn btn-secondary btn-xs" data-issue-inv="${it.id}">Issue -5</button>
                          <button class="btn btn-primary btn-xs" data-recv-inv="${it.id}">Receive +20</button>
                        </div>
                      </td>
                    </tr>
                  `;
                }).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;

      container.querySelectorAll('[data-issue-inv]').forEach(btn => {
        btn.onclick = () => {
          const item = db.inventoryItems.find(x => x.id === btn.getAttribute('data-issue-inv'));
          if (!item) return;
          if (!session.bugMode && item.stock < 5) {
            showToast(`Insufficient stock for ${item.name}.`, 'error');
            return;
          }
          // Intentional QA Bug #6 when Bug Mode is ON: Adds +5 instead of subtracting -5!
          item.stock = session.bugMode ? item.stock + 5 : item.stock - 5;
          logAudit('Stores & Inventory', `Issued 5 ${item.unit} of ${item.name}`);
          saveState();
          renderStockLedgerModule(container);
          showToast(`Issued 5 ${item.unit} of ${item.name}.`, 'info');
        };
      });

      container.querySelectorAll('[data-recv-inv]').forEach(btn => {
        btn.onclick = () => {
          const item = db.inventoryItems.find(x => x.id === btn.getAttribute('data-recv-inv'));
          if (!item) return;
          item.stock += 20;
          logAudit('Stores & Inventory', `Received 20 ${item.unit} of ${item.name}`);
          saveState();
          renderStockLedgerModule(container);
          showToast(`Received +20 ${item.unit} into ${item.name}.`, 'success');
        };
      });
    }

    function renderNightAuditModule(container) {
      const inHouseCount = db.reservations.filter(r => r.status === 'Checked-In').length;
      container.innerHTML = `
        <div class="page-header">
          <div>
            <h1 class="page-title">End-of-Day Night Audit & Business Date Rollover</h1>

        </div>

        <div class="kpi-grid">
